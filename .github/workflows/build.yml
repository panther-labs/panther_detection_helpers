on:
  push:
    branches:
      - main  # Splitting out main here ensures we do not redundantly run this workflow on merge from a PR
  pull_request:
    branches:
      - '*' # Match all branches

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.11
      - name: Install pipenv
        run: make install-pipenv
      - name: Install dependencies
        run: make deps
      - name: Run Linter
        run: make lint
      - name: Run tests
        run: make test

  fmt:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.11
      - name: Install pipenv
        run: make install-pipenv
      - name: Install
        run: make install-no-reqs
      - name: Format
        run: make fmt
      - name: Check formatting
        run: |
          if ! git diff --exit-code; then
            echo "::error::Files are not formatted. Run 'make fmt' locally and commit the result."
            exit 1
          fi
